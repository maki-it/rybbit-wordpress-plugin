name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# All checks run in Docker through the Makefile, the same way as on a local machine.
# Pull requests from this repository already run on push. Only pull requests from forks run again.

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check PHP syntax
        run: make lint PHP_VERSIONS=${{ matrix.php }}

  phpcs:
    name: Coding standards
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run PHPCS (WPCS and PHPCompatibilityWP)
        run: make phpcs

  plugin-check:
    name: Plugin Check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Plugin Check
        run: make plugin-check

      - name: Show the WordPress debug log
        if: always()
        run: make logs || true

  dashboard-test:
    name: Dashboard test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the dashboard test against the mock Rybbit API
        run: make test-dashboard

      - name: Show the WordPress debug log
        if: always()
        run: make logs || true

  optout-test:
    name: Opt-out test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the opt-out shortcode and block (PHP checks and browser test)
        run: make test-optout

      - name: Show the WordPress debug log
        if: always()
        run: make logs || true

  # Use this job as the only required status check in the branch protection.
  # It fails when a check fails or is cancelled. It has the same "if" as the checks, so only one run per commit counts.
  ci-success:
    name: CI success
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
    needs: [lint, phpcs, plugin-check, dashboard-test, optout-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*|*" skipped "*) exit 1 ;;
          esac
