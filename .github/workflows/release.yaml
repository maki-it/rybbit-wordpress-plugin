name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN: integrate-rybbit
  CHANGELOG_LIMIT: 10
  # Stable releases and pre-releases. A pre-release has a suffix like "-rc.1".
  TAG_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set the version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "${GITHUB_REF_NAME}" =~ ${TAG_REGEX} ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a valid version tag (example: v1.2.3)."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          # A version suffix or the pre-release flag of the GitHub release marks a pre-release.
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          elif [[ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease 2>/dev/null || true)" == "true" ]]; then
            PRERELEASE=true
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"

          MAIN_FILE="${PLUGIN}/${PLUGIN}.php"
          README="${PLUGIN}/readme.txt"

          # Replace the values. The header line can start with " * ".
          sed -i -E "s/^([[:space:]*]*Version:[[:space:]]*).*/\1${VERSION}/" "$MAIN_FILE"
          sed -i -E "s/define\( 'INTEGRATE_RYBBIT_VERSION', '[^']*' \);/define( 'INTEGRATE_RYBBIT_VERSION', '${VERSION}' );/" "$MAIN_FILE"
          sed -i -E "s/^Stable tag:[[:space:]]*.*/Stable tag: ${VERSION}/" "$README"

          # Make sure that every replacement worked.
          grep -Eq "^[[:space:]*]*Version:[[:space:]]*${VERSION//./\\.}$" "$MAIN_FILE"
          grep -Fq "define( 'INTEGRATE_RYBBIT_VERSION', '${VERSION}' );" "$MAIN_FILE"
          grep -Fxq "Stable tag: ${VERSION}" "$README"

      - name: Write the changelog into readme.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # readme.txt expects one heading per version:
          # = 1.2.3 =
          # - Change
          CHANGELOG="${RUNNER_TEMP}/changelog.txt"
          RELEASES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          : > "$CHANGELOG"

          RELEASES_JSON="${RUNNER_TEMP}/releases.json"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | {tag_name, body, draft}]' \
            > "$RELEASES_JSON"

          # --paginate can print one JSON array per page. Merge them and drop drafts and
          # invalid tags. Older pre-releases are dropped too. Keep the newest releases only.
          RELEASES_MERGED="${RUNNER_TEMP}/releases-merged.json"
          jq -s --arg re "$TAG_REGEX" --arg cur "$GITHUB_REF_NAME" --argjson n "$CHANGELOG_LIMIT" \
            'add // []
              | map(select((.draft | not) and (.tag_name | test($re))))
              | map(select(.tag_name == $cur or (.tag_name | contains("-") | not)))
              | .[0:$n]' \
            "$RELEASES_JSON" > "$RELEASES_MERGED"

          # The release of this tag can be missing, for example after "git push --tags".
          # Then the changelog gets a link to the release page.
          if ! jq -e --arg cur "$GITHUB_REF_NAME" 'any(.[]; .tag_name == $cur)' "$RELEASES_MERGED" > /dev/null; then
            printf '= %s =\n- %s\n\n' "$VERSION" "${RELEASES_URL}/tag/${GITHUB_REF_NAME}" >> "$CHANGELOG"
          fi

          # base64 keeps multiline release bodies safe in the loop.
          jq -r '.[] | @base64' "$RELEASES_MERGED" \
            | while IFS= read -r enc; do
                obj=$(printf '%s' "$enc" | base64 -d)
                TAG=$(printf '%s' "$obj" | jq -r '.tag_name')
                BODY=$(printf '%s' "$obj" | jq -r '.body // ""')

                # Every non-empty line becomes a "- " bullet.
                # Markdown headings, HTML comments and "Full Changelog" links are dropped.
                ITEMS=$(printf '%s\n' "$BODY" \
                  | sed -e 's/\r$//' \
                  | awk 'NF {
                      if ($0 ~ /^[[:space:]]*#{1,6}[[:space:]]+/) next
                      if ($0 ~ /^[[:space:]]*<!--/) next
                      if ($0 ~ /^[[:space:]]*\*\*Full Changelog\*\*/) next
                      if ($0 ~ /^[[:space:]]*[-*][[:space:]]+/) {
                        sub(/^[[:space:]]*[-*][[:space:]]+/, "- ")
                        print
                      } else {
                        print "- " $0
                      }
                    }')
                if [ -z "$ITEMS" ]; then
                  ITEMS="- ${RELEASES_URL}/tag/${TAG}"
                fi

                printf '= %s =\n%s\n\n' "${TAG#v}" "$ITEMS" >> "$CHANGELOG"
              done

          # Replace everything between "== Changelog ==" and the next section.
          README="${PLUGIN}/readme.txt"
          awk -v changelog="$CHANGELOG" -v releases="$RELEASES_URL" '
            /^== Changelog ==[[:space:]]*$/ {
              print
              print ""
              while ((getline line < changelog) > 0) print line
              print "You can find all releases at: " releases
              print ""
              skip = 1
              next
            }
            skip && /^== / { skip = 0 }
            !skip { print }
          ' "$README" > "${RUNNER_TEMP}/readme.txt"
          mv "${RUNNER_TEMP}/readme.txt" "$README"

          grep -Fxq "== Changelog ==" "$README"
          grep -Fxq "== External services ==" "$README"
          sed -n '/^== Changelog ==/,/^== External services ==/p' "$README"

      - name: Run all checks
        run: make check

      - name: Add the license to the plugin folder
        run: cp LICENSE "${PLUGIN}/"

      - name: Deploy to WordPress.org
        # Pre-releases are not deployed. WordPress.org would offer them to all sites as an update.
        if: env.PRERELEASE == 'false'
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        with:
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: ${{ env.PLUGIN }}/
          ASSETS_DIR: assets/

      - name: Build the plugin zip
        run: make zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/${{ env.PLUGIN }}.zip
          # An empty value keeps the pre-release flag of an existing release.
          prerelease: ${{ env.PRERELEASE == 'true' && 'true' || '' }}
